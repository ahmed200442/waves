name: Build WAVE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: wave-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore source archive
        run: |
          test -f source/WAVE-source.tar.gz.b64
          base64 --decode source/WAVE-source.tar.gz.b64 > /tmp/wave-source.tar.gz
          tar -tzf /tmp/wave-source.tar.gz
          tar -xzf /tmp/wave-source.tar.gz -C .
          rm -rf source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --fetch-retries=3 --fetch-timeout=120000

      - name: Verify source
        run: node scripts/verify-source.mjs

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-Messenger-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
